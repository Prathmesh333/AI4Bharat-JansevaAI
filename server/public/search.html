<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanSeva AI - Find Government Schemes</title>
    <!-- We will reuse existing index.html styles for the header and typography -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #ea580c;
            --secondary: #c2410c;
            --accent: #15803d;
            --primary-soft: #fff7ed;
            --success-soft: #f0fdf4;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #fffdfa;
            --surface: #ffffff;
            --border: #f0e4d8;
            --success: #16a34a;
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #ffffff 0%, #fffaf4 55%, #ffffff 100%);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Site Header - Duplicate from index.html for consistency */
        .site-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(194, 65, 12, 0.12);
            transition: all 0.3s ease;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary) 58%, var(--accent));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.25rem;
        }

        .logo-text span {
            color: var(--accent);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.2s;
        }

        .header-nav a:hover {
            color: var(--primary);
        }

        /* Main Directory Layout */
        .directory-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            align-items: start;
        }

        /* Search Header */
        .search-hero {
            grid-column: 1 / -1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-soft) 0%, #ffffff 58%, var(--success-soft) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.25rem;
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.05);
        }

        .search-bar-wrapper {
            display: flex;
            gap: 0;
            align-items: center;
            background: var(--surface);
            border: 1px solid rgba(234, 88, 12, 0.20);
            border-radius: 18px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 14px 30px rgba(194, 65, 12, 0.08);
        }

        .search-input {
            flex: 1;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            outline: none;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--secondary);
        }

        /* Tabs mimicking myscheme */
        .scheme-tabs {
            grid-column: 1 / -1;
            display: flex;
            gap: 0.75rem;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            padding: 0.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.05);
        }

        .tab {
            padding: 0.9rem 1.15rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            border-radius: 14px;
        }

        .tab.active {
            color: var(--primary);
            background: var(--primary-soft);
            box-shadow: inset 0 0 0 1px rgba(234, 88, 12, 0.12);
        }

        .tab.active::after {
            display: none;
        }

        .results-area {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.05);
        }

        /* Results Header */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .results-count {
            font-weight: 600;
            color: var(--text-muted);
        }

        .results-count span {
            color: var(--text-main);
            font-size: 1.1rem;
        }

        /* Sidebar Filters */
        .sidebar {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.05);
            position: sticky;
            top: 96px;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .filter-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .filter-reset {
            color: var(--success);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .filter-group {
            border-top: 1px solid var(--border);
            padding: 1.25rem 0;
        }

        .filter-group:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .filter-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .filter-label svg {
            width: 16px;
            height: 16px;
            color: var(--accent);
        }

        .filter-select {
            width: 100%;
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-muted);
            outline: none;
            background: var(--surface);
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: rgba(234, 88, 12, 0.35);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.10);
        }

        /* Scheme Cards */
        .scheme-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .scheme-card {
            background: linear-gradient(180deg, #ffffff 0%, #fffdf8 100%);
            border-radius: var(--radius-md);
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease;
            position: relative;
        }

        .scheme-card:hover {
            box-shadow: 0 18px 36px rgba(194, 65, 12, 0.10);
            border-color: rgba(234, 88, 12, 0.24);
        }

        .scheme-ministry {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .scheme-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
            text-decoration: none;
            display: inline-block;
        }

        .scheme-title:hover {
            color: var(--primary);
        }

        .scheme-desc {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .scheme-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: var(--success-soft);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .read-more-link {
            border-color: var(--primary);
            color: var(--primary);
            text-decoration: none;
            background: var(--primary-soft);
        }

        .read-more-link:hover {
            background: #ffe9d6;
        }

        /* Loading State */
        .loader {
            display: none;
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .loader.active {
            display: block;
        }

        @media(max-width: 900px) {
            .directory-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            /* Could add a mobile toggle button */
        }
    </style>
</head>

<body>

    <header class="site-header" id="siteHeader">
        <div class="header-inner">
            <a href="/" class="logo-area">
                <div class="logo-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                        style="width:24px;height:24px">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z" />
                    </svg>
                </div>
                <div class="logo-text">Jan<span>Seva</span> AI</div>
            </a>
            <div class="header-nav">
                <a href="/">Home</a>
                <a href="/search.html" style="color: var(--primary);">Search Schemes</a>
            </div>
        </div>
    </header>

    <main class="directory-container">

        <div class="search-hero">
            <form id="searchForm" class="search-bar-wrapper" onsubmit="handleSearch(event)">
                <input type="text" id="searchInput" class="search-input" placeholder="Enter scheme name to search...">
                <button type="submit" class="search-btn">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                        style="width:20px;height:20px">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                </button>
            </form>
        </div>

        <div class="scheme-tabs">
            <div class="tab active" data-level="">All Schemes</div>
            <div class="tab" data-level="State">State Schemes</div>
            <div class="tab" data-level="Central">Central Schemes</div>
        </div>

        <aside class="sidebar">
            <div class="filter-header">
                <div class="filter-title">Filter By</div>
                <a href="#" class="filter-reset" onclick="resetFilters()">Reset Filters</a>
            </div>

            <div class="filter-group">
                <div class="filter-label">State <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 5v14m-7-7h14" />
                    </svg></div>
                <select class="filter-select" id="stateFilter">
                    <option value="">Select State</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                    <option value="Chandigarh">Chandigarh</option>
                    <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                    <option value="Ladakh">Ladakh</option>
                    <option value="Lakshadweep">Lakshadweep</option>
                    <option value="Puducherry">Puducherry</option>
                </select>
            </div>

            <div class="filter-group">
                <div class="filter-label">Scheme Category <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 5v14m-7-7h14" />
                    </svg></div>
                <select class="filter-select" id="categoryFilter">
                    <option value="">Select Category</option>
                </select>
            </div>

            <div class="filter-group">
                <div class="filter-label">Gender <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 5v14m-7-7h14" />
                    </svg></div>
                <select class="filter-select" id="genderFilter">
                    <option value="">Select</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Transgender">Transgender</option>
                </select>
            </div>

            <div class="filter-group">
                <div class="filter-label">Caste <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 5v14m-7-7h14" />
                    </svg></div>
                <select class="filter-select" id="casteFilter">
                    <option value="">Select</option>
                    <option value="ST">ST</option>
                    <option value="SC">SC</option>
                    <option value="OBC">OBC</option>
                    <option value="General">General</option>
                </select>
            </div>

            <button class="search-btn" style="width:100%; justify-content:center; border-radius:6px; margin-top: 1rem;"
                onclick="applyFilters()">Apply Filters</button>
        </aside>

        <section class="results-area">
            <div class="results-header">
                <div class="results-count">Showing <span id="shownSchemes">0</span> of <span id="totalSchemes">0</span> schemes</div>
                <select class="filter-select" style="width:auto; border-color:transparent; font-weight:600;">
                    <option>Sort : Relevance</option>
                    <option>Sort : Newly Added</option>
                </select>
            </div>

            <div id="loader" class="loader">Loading amazing schemes for you...</div>

            <div class="scheme-list" id="schemeList">
                <!-- Dynamically populated via JS -->
            </div>

            <div style="text-align:center; padding: 2rem;">
                <button class="search-btn" id="loadMoreBtn"
                    style="display:none; margin:0 auto; border-radius:24px; background: white; color: var(--primary); border: 1px solid var(--primary);"
                    onclick="loadPage(currentPage + 1)">Load More</button>
            </div>
        </section>

    </main>

    <script>
        let currentPage = 1;
        let activeSearchQuery = '';
        let activeLevelFilter = '';
        let cachedFilteredResults = [];
        let cachedFilteredKey = '';
        const pageSize = 10;

        function normalizeLevel(level) {
            const normalized = (level || '').trim().toLowerCase();
            if (normalized === 'state') return 'State';
            if (normalized === 'central') return 'Central';
            return '';
        }

        const initialFilters = (() => {
            const params = new URLSearchParams(window.location.search);
            return {
                state: (params.get('state') || '').trim(),
                category: (params.get('category') || '').trim(),
                level: normalizeLevel(params.get('level') || '')
            };
        })();
        activeLevelFilter = initialFilters.level;

        function ensureSelectOption(selectEl, value) {
            if (!value) return;
            const normalized = value.toLowerCase();
            let matched = Array.from(selectEl.options).find(opt => opt.value.toLowerCase() === normalized);

            if (!matched) {
                selectEl.add(new Option(value, value));
                matched = selectEl.options[selectEl.options.length - 1];
            }

            selectEl.value = matched.value;
        }

        function buildFilterQuery() {
            return document.getElementById('searchInput').value.trim();
        }

        function applyInitialFiltersFromUrl() {
            ensureSelectOption(document.getElementById('stateFilter'), initialFilters.state);
            ensureSelectOption(document.getElementById('categoryFilter'), initialFilters.category);
        }

        function setActiveSchemeTab(level) {
            activeLevelFilter = normalizeLevel(level);
            document.querySelectorAll('.scheme-tabs .tab').forEach(tab => {
                const tabLevel = normalizeLevel(tab.dataset.level || '');
                tab.classList.toggle('active', tabLevel === activeLevelFilter);
            });
        }

        function initializeSchemeTabs() {
            document.querySelectorAll('.scheme-tabs .tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    setActiveSchemeTab(tab.dataset.level || '');
                    loadPage(1, activeSearchQuery);
                });
            });
            setActiveSchemeTab(activeLevelFilter);
        }

        function initializePage() {
            applyInitialFiltersFromUrl();
            initializeSchemeTabs();
            loadPage(1, buildFilterQuery());
        }

        // API Configuration
        const API_BASE_URL = 'https://zz3f5dt1ee.execute-api.ap-south-2.amazonaws.com/prod';

        // Load Categories on init
        fetch(`${API_BASE_URL}/api/schemes/categories`)
            .then(res => res.json())
            .then(res => {
                if (res.success && res.data.categories) {
                    const sel = document.getElementById('categoryFilter');
                    res.data.categories.forEach(c => {
                        sel.add(new Option(c.category, c.category));
                    });
                }
            })
            .catch(err => {
                console.error('Failed to load categories:', err);
            })
            .finally(() => {
                initializePage();
            });

        function renderCard(scheme) {
            const tagsHtml = (scheme.tags || []).slice(0, 5).map(tag => `<span class="tag">${tag}</span>`).join('');

            return `
                <div class="scheme-card">
                    <div class="scheme-ministry">${scheme.level === 'State' ? 'State Government' : 'Central Government'} - ${(scheme.category || 'General Welfare')}</div>
                    <a href="scheme.html?slug=${scheme.slug}" class="scheme-title">${scheme.scheme_name || scheme.schemeName || 'Government Scheme'}</a>
                    <p class="scheme-desc">${scheme.excerpt || ''}...</p>
                    <div class="scheme-tags">
                        ${tagsHtml}
                        <a href="scheme.html?slug=${scheme.slug}" class="tag read-more-link">Read More</a>
                    </div>
                </div>
            `;
        }

        function updateResultsSummary(total, shown) {
            document.getElementById('totalSchemes').textContent = String(total);
            document.getElementById('shownSchemes').textContent = String(shown);
        }

        function getActiveFilterState(searchQuery = activeSearchQuery) {
            return {
                query: (searchQuery || '').trim(),
                state: document.getElementById('stateFilter').value.trim(),
                category: document.getElementById('categoryFilter').value.trim(),
                gender: document.getElementById('genderFilter').value.trim(),
                caste: document.getElementById('casteFilter').value.trim(),
                level: activeLevelFilter || ''
            };
        }

        function buildUserProfilePayload(filters) {
            const userProfile = {};

            if (filters.state) {
                userProfile.state = filters.state;
            }

            if (filters.gender) {
                userProfile.gender = filters.gender.toLowerCase();
            }

            if (filters.caste) {
                userProfile.category = filters.caste.toLowerCase();
            }

            return Object.keys(userProfile).length > 0 ? userProfile : undefined;
        }

        function buildFilteredResultsKey(filters) {
            return JSON.stringify(filters);
        }

        function renderFilteredResults(page) {
            const safePage = Math.max(1, page);
            const total = cachedFilteredResults.length;
            const shown = Math.min(safePage * pageSize, total);
            const visibleResults = cachedFilteredResults.slice(0, shown);

            document.getElementById('schemeList').innerHTML = visibleResults.map(renderCard).join('');
            updateResultsSummary(total, visibleResults.length);
            document.getElementById('loadMoreBtn').style.display = shown < total ? 'block' : 'none';

            if (total === 0) {
                document.getElementById('schemeList').innerHTML = '<p>No schemes found.</p>';
            }
        }

        function loadPage(page = 1, searchQuery = activeSearchQuery) {
            document.getElementById('loader').classList.add('active');
            document.getElementById('loadMoreBtn').style.display = 'none';
            if (page === 1) {
                activeSearchQuery = searchQuery || '';
                document.getElementById('schemeList').innerHTML = '';
            }

            currentPage = page;
            const filters = getActiveFilterState(page === 1 ? activeSearchQuery : activeSearchQuery);
            const shouldUseSearchApi = Boolean(
                filters.query ||
                filters.level ||
                filters.category ||
                filters.state ||
                filters.gender ||
                filters.caste
            );

            // Hit our default paginated endpoint if no complex search required
            // Or fetch the full filtered result set once and paginate on the client.
            if (shouldUseSearchApi) {
                const filterKey = buildFilteredResultsKey(filters);

                if (page === 1 || filterKey !== cachedFilteredKey) {
                    cachedFilteredKey = filterKey;
                    cachedFilteredResults = [];
                }

                if (cachedFilteredResults.length > 0) {
                    document.getElementById('loader').classList.remove('active');
                    renderFilteredResults(page);
                    return;
                }

                fetch(`${API_BASE_URL}/api/schemes/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: filters.query || undefined,
                        category: filters.category || undefined,
                        level: filters.level || undefined,
                        userProfile: buildUserProfilePayload(filters),
                        limit: 5000,
                        page: 1,
                        pageSize: 5000
                    })
                })
                    .then(res => res.json())
                    .then(res => {
                        document.getElementById('loader').classList.remove('active');
                        if (!res.success) {
                            throw new Error('Failed to load schemes');
                        }

                        cachedFilteredResults = Array.isArray(res.data) ? res.data : [];
                        renderFilteredResults(page);
                    })
                    .catch(err => {
                        document.getElementById('loader').classList.remove('active');
                        console.error(err);
                    });
                return;
            }

            const url = `${API_BASE_URL}/api/schemes?page=${page}&pageSize=${pageSize}`;

            fetch(url, {
                method: 'GET'
            })
                .then(res => res.json())
                .then(res => {
                    document.getElementById('loader').classList.remove('active');
                    if (res.success) {
                        const list = res.data; // array of schemes
                        const total = typeof res.total === 'number' ? res.total : list.length;
                        const pages = typeof res.pages === 'number' ? res.pages : 1;

                        if (list.length > 0) {
                            list.forEach(s => {
                                document.getElementById('schemeList').insertAdjacentHTML('beforeend', renderCard(s));
                            });
                            const shown = document.querySelectorAll('#schemeList .scheme-card').length;
                            updateResultsSummary(total, shown);
                            document.getElementById('loadMoreBtn').style.display = currentPage < pages ? 'block' : 'none';
                        } else {
                            document.getElementById('loadMoreBtn').style.display = 'none';
                            updateResultsSummary(total, 0);
                            if (page === 1) document.getElementById('schemeList').innerHTML = '<p>No schemes found.</p>';
                        }
                    }
                })
                .catch(err => {
                    document.getElementById('loader').classList.remove('active');
                    console.error(err);
                });
        }

        function handleSearch(e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value;
            loadPage(1, q);
        }

        function applyFilters() {
            // Simplified: In full integration, we would POST all these fields to evaluateEligibilityRAG or advancedSearch
            loadPage(1, buildFilterQuery());
        }

        function resetFilters() {
            document.getElementById('stateFilter').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('genderFilter').value = '';
            document.getElementById('casteFilter').value = '';
            document.getElementById('searchInput').value = '';
            cachedFilteredResults = [];
            cachedFilteredKey = '';
            setActiveSchemeTab('');
            loadPage(1);
        }

    </script>
</body>

</html>
